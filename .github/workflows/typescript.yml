name: typescript

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Workspace checks
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run typescript:check
          pnpm -r --if-present check
