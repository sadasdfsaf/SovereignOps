name: node

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/node-check.mjs
      - name: Workspace checks
        shell: bash
        run: |
          if command -v pnpm >/dev/null 2>&1; then
            pnpm -r --if-present check
          else
            echo "pnpm not installed; skipping workspace checks"
          fi
