[workspace]
resolver = "2"
members = [
  "crates/sovereign_core",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/sovereignops/sovereignops"
rust-version = "1.76"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

