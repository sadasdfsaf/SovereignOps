components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SovereignRecordId"
    McpApprovalSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    QuarantineCaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/QuarantineCaseId"
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IngestSearchError:
      description: JSON error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestSearchErrorResponse"
    IngestEvidenceError:
      description: Ingest evidence JSON error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestEvidenceErrorResponse"
    ApiError:
      description: Standard API error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            badRequest:
              value:
                schemaVersion: api-error/v1
                error:
                  code: bad_request
                  status: 400
                  message: Request body must be an object.
                  requestId: req_local_events_00000001
  schemas:
    WorkspaceId:
      type: string
      pattern: "^wsp_[A-Za-z0-9_-]{1,88}$"
    ActorId:
      type: string
      pattern: "^act_[A-Za-z0-9_-]{1,88}$"
    SovereignRecordId:
      type: string
      pattern: "^(doc|prj|inc|cmt|att|apv|obj)_[A-Za-z0-9_-]{1,88}$"
    RecordKind:
      type: string
      enum:
        - docs
        - projects
        - incidents
        - comments
        - attachments
        - approvals
    RiskLevel:
      type: string
      enum:
        - low
        - medium
        - high
    PolicyDecision:
      type: string
      enum:
        - allow
        - require_approval
        - deny
    GatewayCapability:
      type: string
      enum:
        - read_object
        - write_object
        - propose_agent_action
        - manage_plugin
        - sync_bundle
    HealthResponse:
      type: object
      required:
        - ok
        - service
      properties:
        ok:
          type: boolean
        service:
          type: string
          const: sovereignops-local-api
    RecordBase:
      type: object
      required:
        - id
        - workspaceId
        - status
        - risk
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/SovereignRecordId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        status:
          type: string
        risk:
          $ref: "#/components/schemas/RiskLevel"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    DocRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - title
            - ownerActorId
          properties:
            id:
              type: string
              pattern: "^doc_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - draft
                - review
                - active
                - archived
            title:
              type: string
              minLength: 1
            body:
              type: string
            projectId:
              type: string
              pattern: "^prj_[A-Za-z0-9_-]{1,88}$"
            ownerActorId:
              $ref: "#/components/schemas/ActorId"
    ProjectRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - name
            - ownerActorId
          properties:
            id:
              type: string
              pattern: "^prj_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - planned
                - active
                - paused
                - completed
                - archived
            name:
              type: string
              minLength: 1
            ownerActorId:
              $ref: "#/components/schemas/ActorId"
    IncidentRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - title
            - reportedByActorId
          properties:
            id:
              type: string
              pattern: "^inc_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - open
                - triaged
                - resolved
                - closed
            title:
              type: string
              minLength: 1
            summary:
              type: string
            projectId:
              type: string
              pattern: "^prj_[A-Za-z0-9_-]{1,88}$"
            reportedByActorId:
              $ref: "#/components/schemas/ActorId"
    CommentRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - targetId
            - body
            - authorActorId
          properties:
            id:
              type: string
              pattern: "^cmt_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - open
                - resolved
                - deleted
            targetId:
              $ref: "#/components/schemas/SovereignRecordId"
            body:
              type: string
              minLength: 1
            authorActorId:
              $ref: "#/components/schemas/ActorId"
    AttachmentRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - targetId
