openapi: 3.1.0
info:
  title: SovereignOps Local API
  version: 0.1.0
  description: Contract for local-first encrypted workspace records, agent action previews, and audit reads.
servers:
  - url: http://127.0.0.1:7317
    description: Local gateway
tags:
  - name: health
  - name: records
  - name: agent-actions
  - name: audit
  - name: sync
  - name: mcp
  - name: lifecycle
  - name: local-events
  - name: observability
  - name: ingest
  - name: search
  - name: quarantine
  - name: plugins
  - name: workspace-session
paths:
  /health:
    get:
      tags:
        - health
      summary: Check the local gateway status.
      operationId: getHealth
      responses:
        "200":
          description: Gateway status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/bundles:
    post:
      tags:
        - sync
      summary: Upload an encrypted sync bundle.
      operationId: uploadSyncBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUploadBatch"
      responses:
        "201":
          description: Accepted bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncUploadReceipt"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/download:
    post:
      tags:
        - sync
      summary: Download encrypted events after a cursor.
      operationId: downloadSyncWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDownloadRequest"
      responses:
        "200":
          description: Sync download window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDownloadWindow"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/cursor-status:
    post:
      tags:
        - sync
      summary: Compare a client cursor with the relay cursor.
      operationId: getSyncCursorStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncCursorStatusRequest"
      responses:
        "200":
          description: Cursor comparison result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCursorStatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/resources:
    get:
      tags:
        - mcp
      summary: List policy-visible MCP resources.
      operationId: listMcpResources
      responses:
        "200":
          description: Resources visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResourceListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/resources/read:
    post:
      tags:
        - mcp
      summary: Read one MCP resource after policy evaluation.
      operationId: readMcpResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpReadResourceRequest"
      responses:
        "200":
          description: Resource contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpReadResourceResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/tools:
    get:
      tags:
        - mcp
      summary: List safe local MCP tools exposed by the local gateway.
      operationId: listMcpTools
      responses:
        "200":
          description: Safe local tool descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/tools/execute:
    post:
      tags:
        - mcp
      summary: Preview a safe local tool call.
      operationId: executeMcpToolPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolExecuteRequest"
      responses:
        "200":
          description: Tool preview result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolExecuteResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/tools/call:
    post:
      tags:
        - mcp
      summary: Call a safe local MCP tool through policy and audit controls.
      operationId: callMcpTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolCallRequest"
      responses:
        "200":
          description: Safe local tool call result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolCallResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-sessions:
    get:
      tags:
        - mcp
      summary: List MCP approval sessions.
      operationId: listMcpApprovalSessions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/McpApprovalSessionStatus"
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Approval session snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalSessionListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-sessions/{sessionId}/decision:
    post:
      tags:
        - mcp
      summary: Record an approval or rejection decision for an MCP approval session.
      operationId: decideMcpApprovalSession
      parameters:
        - $ref: "#/components/parameters/McpApprovalSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpApprovalSessionDecisionRequest"
      responses:
        "200":
          description: Updated approval session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalSessionDecisionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/records:
    get:
      tags:
        - records
      summary: List records in a workspace.
      operationId: listRecords
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RecordKind"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Records for the selected workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - records
      summary: Create a workspace record after policy evaluation.
      operationId: createRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "201":
          description: Created record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/records/{recordId}:
    get:
      tags:
        - records
      summary: Read one workspace record.
      operationId: getRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Matching record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - records
      summary: Update one workspace record after policy evaluation.
      operationId: updateRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordRequest"
      responses:
        "200":
          description: Updated record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/agent-actions/preview:
    post:
      tags:
        - agent-actions
      summary: Build an action preview before durable execution.
      operationId: previewAgentAction
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionPreviewRequest"
      responses:
        "200":
          description: Preview and current policy decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionPreviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/audit:
    get:
      tags:
        - audit
      summary: List redacted audit entries for a workspace.
      operationId: listAuditEntries
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Redacted audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit/export/jsonl:
    post:
      tags:
        - audit
      summary: Export supplied audit events as deterministic JSONL.
      operationId: exportAuditJsonl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportRequest"
      responses:
        "200":
          description: JSONL content plus manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportContentResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit/export/csv:
    post:
      tags:
        - audit
      summary: Export supplied audit events as deterministic CSV.
      operationId: exportAuditCsv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportRequest"
      responses:
        "200":
          description: CSV content plus manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportContentResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit/export/package:
    post:
      tags:
        - audit
      summary: Export supplied audit events as a deterministic package.
      operationId: exportAuditPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportRequest"
      responses:
        "200":
          description: Package with JSONL, CSV, manifest, and fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportPackage"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/migrations/plan:
    post:
      tags:
        - lifecycle
      summary: Plan workspace metadata migrations without applying changes.
      operationId: planMigration
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationPlanRequest"
      responses:
        "200":
          description: Dry-run migration plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationPlanResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/migrations/run:
    post:
      tags:
        - lifecycle
      summary: Run workspace metadata migrations.
      operationId: runMigration
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRunRequest"
      responses:
        "200":
          description: Migration run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationRunResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/backups/manifests:
    post:
      tags:
        - lifecycle
      summary: Submit an encrypted backup manifest for a workspace.
      operationId: submitBackupManifest
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupManifestSubmitRequest"
      responses:
        "201":
          description: Accepted backup manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupManifest"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/restores/plan:
    post:
      tags:
        - lifecycle
      summary: Plan a restore from an encrypted backup manifest.
      operationId: planRestore
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestorePlanRequest"
      responses:
        "200":
          description: Restore plan and safety result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlanResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/observability/events:
    post:
      tags:
        - observability
      summary: Submit a structured local observability event.
      operationId: submitObservabilityEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservabilityEventSubmitRequest"
      responses:
        "202":
          description: Accepted observability event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityEvent"
        default:
          $ref: "#/components/responses/Error"
  /v1/observability/metrics:
    post:
      tags:
        - observability
      summary: Submit a structured local observability metric.
      operationId: submitObservabilityMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservabilityMetric"
      responses:
        "202":
          description: Accepted observability metric.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityMetric"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/compactions/plan:
    post:
      tags:
        - lifecycle
      summary: Plan event compaction for a workspace sequence range.
      operationId: planCompaction
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompactionPlanRequest"
      responses:
        "200":
          description: Dry-run compaction plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactionPlanResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/ingest/connectors:
    get:
      tags:
        - ingest
      summary: List local ingest connector profiles.
      description: Returns the in-process connector capability manifest. This route does not read files, call network services, or perform durable writes.
      operationId: listIngestConnectors
      responses:
        "200":
          description: Local connector profiles for preview clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestConnectorManifest"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/connectors/mcp/resources:
    get:
      tags:
        - ingest
      summary: List local MCP resource manifests for ingest connectors.
      description: Returns MCP-ready resource manifests from local connector metadata without a server, network access, or durable writes.
      operationId: listIngestConnectorMcpResources
      responses:
        "200":
          description: Local MCP resource manifests for ingest connectors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestConnectorMcpResourceListResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/connectors/mcp/resources/{connectorId}:
    get:
      tags:
        - ingest
      summary: Read one local MCP resource manifest for an ingest connector.
      description: Returns one MCP-ready resource manifest from local connector metadata without a server, network access, or durable writes.
      operationId: getIngestConnectorMcpResource
      parameters:
        - name: connectorId
          in: path
          required: true
          schema:
            type: string
            pattern: '^local\.[A-Za-z0-9_.-]{1,96}$'
      responses:
        "200":
          description: Local MCP resource manifest for one ingest connector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestConnectorMcpResourceResponse"
        "404":
          $ref: "#/components/responses/IngestSearchError"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/connectors/mcp/preview:
    post:
      tags:
        - ingest
      summary: Preview an ingest connector MCP resource manifest.
      description: Validates a local dry-run preview request without network access, durable writes, or side effects.
      operationId: previewIngestConnectorMcpResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestConnectorMcpPreviewRequest"
      responses:
        "200":
          description: Dry-run local MCP resource preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestConnectorMcpPreviewResponse"
        "400":
          $ref: "#/components/responses/IngestSearchError"
        "404":
          $ref: "#/components/responses/IngestSearchError"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/normalize:
    post:
      tags:
        - ingest
      summary: Normalize local text for ingest.
      operationId: normalizeIngestContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestNormalizeRequest"
      responses:
        "200":
          description: Normalized text and checksum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestNormalizeResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/structured:
    post:
      tags:
        - ingest
      summary: Parse structured local content into cited records.
      operationId: ingestStructuredContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructuredIngestRequest"
      responses:
        "200":
          description: Parsed records and held items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredIngestResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/repository/scan:
    post:
      tags:
        - ingest
      summary: Scan allowed local paths for ingest sources.
      operationId: scanIngestRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryScanRequest"
      responses:
        "200":
          description: Local source records with checksums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryScanResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/evidence/export:
    post:
      tags:
        - ingest
      summary: Preview a local ingest evidence export.
      description: Local preview only; callers provide evidence JSON in the request body. The route does not read files or call network services.
      operationId: exportIngestEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEvidenceExportRequest"
      responses:
        "200":
          description: Redacted export content with manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEvidenceExportResponse"
        "400":
          $ref: "#/components/responses/IngestEvidenceError"
        default:
          $ref: "#/components/responses/IngestEvidenceError"
  /v1/ingest/evidence/package:
    post:
      tags:
        - ingest
      summary: Preview a local ingest evidence package.
      description: Local preview only; callers provide evidence JSON in the request body. The route does not read files or call network services.
      operationId: packageIngestEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEvidenceExportRequest"
      responses:
        "200":
          description: Package file previews with manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEvidencePackageResponse"
        "400":
          $ref: "#/components/responses/IngestEvidenceError"
        default:
          $ref: "#/components/responses/IngestEvidenceError"
  /v1/local-events/catalog:
    get:
      tags:
        - local-events
      summary: Return a canonical local event catalog.
      description: Local-only catalog preview. Callers may provide an inline catalog or a workspace-local JSON catalog path; the route does not call network services.
      operationId: getLocalEventCatalog
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalEventCatalogRequest"
            examples:
              workspaceCatalog:
                summary: Read the default workspace fixture catalog.
                value:
                  catalogPath: packages/schemas/fixtures/canonical-events.valid.json
      responses:
        "200":
          description: Canonical local event catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalLocalEventCatalog"
              examples:
                catalog:
                  value:
                    schemaVersion: canonical-local-event-catalog/v1
                    generatedAt: "2026-04-27T12:30:00.000Z"
                    workspaceId: wsp_local_catalog
                    localOnly: true
                    events:
                      - schemaVersion: canonical-local-event/v1
                        id: evt_catalog_001
                        workspaceId: wsp_local_catalog
                        actorId: act_local_author
                        sequence: 1
                        occurredAt: "2026-04-27T12:00:00.000Z"
                        recordedAt: "2026-04-27T12:00:01.000Z"
                        localOnly: true
                        operation: append
                        payload:
                          schemaKind: docs
                          recordId: doc_support_handoff
                          summary: Create support handoff note.
                          afterDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                        payloadDigest: 52cadbd6440da90efd2e528ac78ab86dc071b86df9be93df23ed9fa9c5d8bf0a
                        previousDigest: null
                        redactionMetadata:
                          redacted: true
                          redactedFieldCount: 1
                          redactedPaths:
                            - payload.after.body
                          retainedMetadataKeys:
                            - operation
                            - recordId
                            - schemaKind
        "400":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
  /v1/local-events/summary:
    get:
      tags:
        - local-events
      summary: Summarize a canonical local event catalog.
      description: Local-only summary preview for an inline catalog or workspace-local JSON catalog path.
      operationId: summarizeLocalEventCatalog
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalEventCatalogRequest"
            examples:
              workspaceCatalog:
                value:
                  catalogPath: packages/schemas/fixtures/canonical-events.valid.json
      responses:
        "200":
          description: Local event catalog counts and replay selectors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalEventCatalogSummary"
              examples:
                summary:
                  value:
                    workspaceId: wsp_local_catalog
                    generatedAt: "2026-04-27T12:30:00.000Z"
                    eventCount: 5
                    firstSequence: 1
                    lastSequence: 5
                    firstRecordedAt: "2026-04-27T12:00:01.000Z"
                    lastRecordedAt: "2026-04-27T12:20:01.000Z"
                    redactedEventCount: 3
                    redactedFieldCount: 3
                    operations:
                      append: 2
                      update: 1
                      delete: 0
                      approval_requested: 1
                      approval_approved: 0
                      approval_rejected: 1
                    schemaKinds:
                      docs: 2
                      projects: 0
                      incidents: 0
                      comments: 1
                      attachments: 0
                      approvals: 2
                    operationSchemaKinds:
                      - operation: append
                        schemaKind: docs
                        count: 1
