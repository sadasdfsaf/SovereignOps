openapi: 3.1.0
info:
  title: SovereignOps Local API
  version: 0.1.0
  description: Contract for local-first encrypted workspace records, agent action previews, and audit reads.
servers:
  - url: http://127.0.0.1:7317
    description: Local gateway
tags:
  - name: health
  - name: records
  - name: agent-actions
  - name: audit
  - name: sync
  - name: mcp
  - name: lifecycle
  - name: observability
  - name: ingest
  - name: search
  - name: quarantine
  - name: plugins
paths:
  /health:
    get:
      tags:
        - health
      summary: Check the local gateway status.
      operationId: getHealth
      responses:
        "200":
          description: Gateway status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/bundles:
    post:
      tags:
        - sync
      summary: Upload an encrypted sync bundle.
      operationId: uploadSyncBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUploadBatch"
      responses:
        "201":
          description: Accepted bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncUploadReceipt"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/download:
    post:
      tags:
        - sync
      summary: Download encrypted events after a cursor.
      operationId: downloadSyncWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncDownloadRequest"
      responses:
        "200":
          description: Sync download window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDownloadWindow"
        default:
          $ref: "#/components/responses/Error"
  /v1/sync/cursor-status:
    post:
      tags:
        - sync
      summary: Compare a client cursor with the relay cursor.
      operationId: getSyncCursorStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncCursorStatusRequest"
      responses:
        "200":
          description: Cursor comparison result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncCursorStatusResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/resources:
    get:
      tags:
        - mcp
      summary: List policy-visible MCP resources.
      operationId: listMcpResources
      responses:
        "200":
          description: Resources visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResourceListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/resources/read:
    post:
      tags:
        - mcp
      summary: Read one MCP resource after policy evaluation.
      operationId: readMcpResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpReadResourceRequest"
      responses:
        "200":
          description: Resource contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpReadResourceResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/tools:
    get:
      tags:
        - mcp
      summary: List safe local MCP tools exposed by the local gateway.
      operationId: listMcpTools
      responses:
        "200":
          description: Safe local tool descriptors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/tools/execute:
    post:
      tags:
        - mcp
      summary: Preview a safe local tool call.
      operationId: executeMcpToolPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolExecuteRequest"
      responses:
        "200":
          description: Tool preview result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolExecuteResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/tools/call:
    post:
      tags:
        - mcp
      summary: Call a safe local MCP tool through policy and audit controls.
      operationId: callMcpTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToolCallRequest"
      responses:
        "200":
          description: Safe local tool call result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpToolCallResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-sessions:
    get:
      tags:
        - mcp
      summary: List MCP approval sessions.
      operationId: listMcpApprovalSessions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/McpApprovalSessionStatus"
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Approval session snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalSessionListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-sessions/{sessionId}/decision:
    post:
      tags:
        - mcp
      summary: Record an approval or rejection decision for an MCP approval session.
      operationId: decideMcpApprovalSession
      parameters:
        - $ref: "#/components/parameters/McpApprovalSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpApprovalSessionDecisionRequest"
      responses:
        "200":
          description: Updated approval session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalSessionDecisionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/records:
    get:
      tags:
        - records
      summary: List records in a workspace.
      operationId: listRecords
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RecordKind"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Records for the selected workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - records
      summary: Create a workspace record after policy evaluation.
      operationId: createRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "201":
          description: Created record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/records/{recordId}:
    get:
      tags:
        - records
      summary: Read one workspace record.
      operationId: getRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Matching record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - records
      summary: Update one workspace record after policy evaluation.
      operationId: updateRecord
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordRequest"
      responses:
        "200":
          description: Updated record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/agent-actions/preview:
    post:
      tags:
        - agent-actions
      summary: Build an action preview before durable execution.
      operationId: previewAgentAction
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionPreviewRequest"
      responses:
        "200":
          description: Preview and current policy decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionPreviewResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/audit:
    get:
      tags:
        - audit
      summary: List redacted audit entries for a workspace.
      operationId: listAuditEntries
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Redacted audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit/export/jsonl:
    post:
      tags:
        - audit
      summary: Export supplied audit events as deterministic JSONL.
      operationId: exportAuditJsonl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportRequest"
      responses:
        "200":
          description: JSONL content plus manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportContentResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit/export/csv:
    post:
      tags:
        - audit
      summary: Export supplied audit events as deterministic CSV.
      operationId: exportAuditCsv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportRequest"
      responses:
        "200":
          description: CSV content plus manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportContentResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/audit/export/package:
    post:
      tags:
        - audit
      summary: Export supplied audit events as a deterministic package.
      operationId: exportAuditPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditExportRequest"
      responses:
        "200":
          description: Package with JSONL, CSV, manifest, and fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditExportPackage"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/migrations/plan:
    post:
      tags:
        - lifecycle
      summary: Plan workspace metadata migrations without applying changes.
      operationId: planMigration
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationPlanRequest"
      responses:
        "200":
          description: Dry-run migration plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationPlanResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/migrations/run:
    post:
      tags:
        - lifecycle
      summary: Run workspace metadata migrations.
      operationId: runMigration
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRunRequest"
      responses:
        "200":
          description: Migration run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationRunResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/backups/manifests:
    post:
      tags:
        - lifecycle
      summary: Submit an encrypted backup manifest for a workspace.
      operationId: submitBackupManifest
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupManifestSubmitRequest"
      responses:
        "201":
          description: Accepted backup manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupManifest"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/restores/plan:
    post:
      tags:
        - lifecycle
      summary: Plan a restore from an encrypted backup manifest.
      operationId: planRestore
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestorePlanRequest"
      responses:
        "200":
          description: Restore plan and safety result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlanResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/observability/events:
    post:
      tags:
        - observability
      summary: Submit a structured local observability event.
      operationId: submitObservabilityEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservabilityEventSubmitRequest"
      responses:
        "202":
          description: Accepted observability event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityEvent"
        default:
          $ref: "#/components/responses/Error"
  /v1/observability/metrics:
    post:
      tags:
        - observability
      summary: Submit a structured local observability metric.
      operationId: submitObservabilityMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservabilityMetric"
      responses:
        "202":
          description: Accepted observability metric.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservabilityMetric"
        default:
          $ref: "#/components/responses/Error"
  /v1/workspaces/{workspaceId}/compactions/plan:
    post:
      tags:
        - lifecycle
      summary: Plan event compaction for a workspace sequence range.
      operationId: planCompaction
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompactionPlanRequest"
      responses:
        "200":
          description: Dry-run compaction plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactionPlanResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/ingest/normalize:
    post:
      tags:
        - ingest
      summary: Normalize local text for ingest.
      operationId: normalizeIngestContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestNormalizeRequest"
      responses:
        "200":
          description: Normalized text and checksum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestNormalizeResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/structured:
    post:
      tags:
        - ingest
      summary: Parse structured local content into cited records.
      operationId: ingestStructuredContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StructuredIngestRequest"
      responses:
        "200":
          description: Parsed records and held items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructuredIngestResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/repository/scan:
    post:
      tags:
        - ingest
      summary: Scan allowed local paths for ingest sources.
      operationId: scanIngestRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryScanRequest"
      responses:
        "200":
          description: Local source records with checksums.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryScanResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/ingest/evidence/export:
    post:
      tags:
        - ingest
      summary: Preview a local ingest evidence export.
      description: Local preview only; callers provide evidence JSON in the request body. The route does not read files or call network services.
      operationId: exportIngestEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEvidenceExportRequest"
      responses:
        "200":
          description: Redacted export content with manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEvidenceExportResponse"
        "400":
          $ref: "#/components/responses/IngestEvidenceError"
        default:
          $ref: "#/components/responses/IngestEvidenceError"
  /v1/ingest/evidence/package:
    post:
      tags:
        - ingest
      summary: Preview a local ingest evidence package.
      description: Local preview only; callers provide evidence JSON in the request body. The route does not read files or call network services.
      operationId: packageIngestEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEvidenceExportRequest"
      responses:
        "200":
          description: Package file previews with manifest metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestEvidencePackageResponse"
        "400":
          $ref: "#/components/responses/IngestEvidenceError"
        default:
          $ref: "#/components/responses/IngestEvidenceError"
  /v1/search/query:
    post:
      tags:
        - search
      summary: Query the local search index.
      operationId: queryLocalSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchQueryRequest"
      responses:
        "200":
          description: Ranked local search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchQueryResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/quarantine/cases:
    post:
      tags:
        - quarantine
      summary: Build review cases from held ingest items.
      operationId: createQuarantineCases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineCasesRequest"
      responses:
        "200":
          description: Review cases ready for local action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineCasesResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/quarantine/cases/{caseId}/decision:
    post:
      tags:
        - quarantine
      summary: Record a terminal decision for one review case.
      operationId: decideQuarantineCase
      parameters:
        - $ref: "#/components/parameters/QuarantineCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineDecisionRequest"
      responses:
        "200":
          description: Updated review case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineDecisionResponse"
        default:
          $ref: "#/components/responses/IngestSearchError"
  /v1/plugins/review-artifacts/preview:
    post:
      tags:
        - plugins
      summary: Preview a local plugin review artifact.
      description: Local preview only; callers provide manifest, sandbox, automation, and audit inputs in the request body.
      operationId: previewPluginReviewArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginReviewArtifactPreviewRequest"
      responses:
        "200":
          description: Redacted plugin review artifact preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReviewArtifactPreviewResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/plugins/review-artifacts/records:
    get:
      tags:
        - plugins
      summary: List stored local plugin review artifact records.
      description: Local-only listing of redacted plugin review artifact record baselines.
      operationId: listPluginReviewArtifactRecords
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginReviewArtifactRecordListRequest"
      responses:
        "200":
          description: Stored plugin review artifact record summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReviewArtifactRecordListResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - plugins
      summary: Store a local plugin review artifact record.
      description: Stores a redacted local plugin review artifact preview baseline in memory.
      operationId: createPluginReviewArtifactRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginReviewArtifactRecordCreateRequest"
      responses:
        "201":
          description: Stored plugin review artifact record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReviewArtifactRecordCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/plugins/review-artifacts/records/{recordId}:
    get:
      tags:
        - plugins
      summary: Retrieve one stored plugin review artifact record.
      description: Reads a redacted local plugin review artifact record by id.
      operationId: getPluginReviewArtifactRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Stored plugin review artifact record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReviewArtifactRecordGetResponse"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/plugins/review-artifacts/records/{recordId}/compare:
    post:
      tags:
        - plugins
      summary: Compare a fresh plugin review artifact with a stored record.
      description: Compares redacted candidate artifact output against a stored local baseline.
      operationId: comparePluginReviewArtifactRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginReviewArtifactRecordCompareRequest"
      responses:
        "200":
          description: Plugin review artifact record comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginReviewArtifactRecordCompareResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-evidence/preview:
    post:
      tags:
        - mcp
      summary: Preview local MCP approval evidence.
      description: Local preview only; callers provide approval session, policy, and audit snapshots in the request body.
      operationId: previewMcpApprovalEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpApprovalEvidencePreviewRequest"
      responses:
        "200":
          description: Redacted MCP approval evidence preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalEvidencePreviewResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-evidence/records:
    get:
      tags:
        - mcp
      summary: List stored local MCP approval evidence records.
      description: Local-only listing of redacted approval evidence record baselines.
      operationId: listMcpApprovalEvidenceRecords
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpApprovalEvidenceRecordListRequest"
      responses:
        "200":
          description: Stored approval evidence record summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalEvidenceRecordListResponse"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - mcp
      summary: Store a local MCP approval evidence record.
      description: Stores a redacted local approval evidence preview as a baseline record.
      operationId: createMcpApprovalEvidenceRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpApprovalEvidenceRecordCreateRequest"
      responses:
        "201":
          description: Stored local approval evidence record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalEvidenceRecordCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-evidence/records/{recordId}:
    get:
      tags:
        - mcp
      summary: Retrieve a stored local MCP approval evidence record.
      description: Reads one redacted local approval evidence record by id.
      operationId: getMcpApprovalEvidenceRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Stored approval evidence record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalEvidenceRecordGetResponse"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mcp/approval-evidence/records/{recordId}/compare:
    post:
      tags:
        - mcp
      summary: Compare current MCP approval evidence with a stored baseline.
      description: Compares a new local preview payload against a stored redacted record.
      operationId: compareMcpApprovalEvidenceRecord
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpApprovalEvidenceRecordCompareRequest"
      responses:
        "200":
          description: Approval evidence comparison result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpApprovalEvidenceRecordCompareResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/WorkspaceId"
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SovereignRecordId"
    McpApprovalSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    QuarantineCaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/QuarantineCaseId"
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IngestSearchError:
      description: JSON error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestSearchErrorResponse"
    IngestEvidenceError:
      description: Ingest evidence JSON error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IngestEvidenceErrorResponse"
  schemas:
    WorkspaceId:
      type: string
      pattern: "^wsp_[A-Za-z0-9_-]{1,88}$"
    ActorId:
      type: string
      pattern: "^act_[A-Za-z0-9_-]{1,88}$"
    SovereignRecordId:
      type: string
      pattern: "^(doc|prj|inc|cmt|att|apv|obj)_[A-Za-z0-9_-]{1,88}$"
    RecordKind:
      type: string
      enum:
        - docs
        - projects
        - incidents
        - comments
        - attachments
        - approvals
    RiskLevel:
      type: string
      enum:
        - low
        - medium
        - high
    PolicyDecision:
      type: string
      enum:
        - allow
        - require_approval
        - deny
    GatewayCapability:
      type: string
      enum:
        - read_object
        - write_object
        - propose_agent_action
        - manage_plugin
        - sync_bundle
    HealthResponse:
      type: object
      required:
        - ok
        - service
      properties:
        ok:
          type: boolean
        service:
          type: string
          const: sovereignops-local-api
    RecordBase:
      type: object
      required:
        - id
        - workspaceId
        - status
        - risk
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/SovereignRecordId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        status:
          type: string
        risk:
          $ref: "#/components/schemas/RiskLevel"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    DocRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - title
            - ownerActorId
          properties:
            id:
              type: string
              pattern: "^doc_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - draft
                - review
                - active
                - archived
            title:
              type: string
              minLength: 1
            body:
              type: string
            projectId:
              type: string
              pattern: "^prj_[A-Za-z0-9_-]{1,88}$"
            ownerActorId:
              $ref: "#/components/schemas/ActorId"
    ProjectRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - name
            - ownerActorId
          properties:
            id:
              type: string
              pattern: "^prj_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - planned
                - active
                - paused
                - completed
                - archived
            name:
              type: string
              minLength: 1
            ownerActorId:
              $ref: "#/components/schemas/ActorId"
    IncidentRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - title
            - reportedByActorId
          properties:
            id:
              type: string
              pattern: "^inc_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - open
                - triaged
                - resolved
                - closed
            title:
              type: string
              minLength: 1
            summary:
              type: string
            projectId:
              type: string
              pattern: "^prj_[A-Za-z0-9_-]{1,88}$"
            reportedByActorId:
              $ref: "#/components/schemas/ActorId"
    CommentRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - targetId
            - body
            - authorActorId
          properties:
            id:
              type: string
              pattern: "^cmt_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - open
                - resolved
                - deleted
            targetId:
              $ref: "#/components/schemas/SovereignRecordId"
            body:
              type: string
              minLength: 1
            authorActorId:
              $ref: "#/components/schemas/ActorId"
    AttachmentRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - targetId
            - filename
            - contentType
            - byteSize
            - uploadedByActorId
          properties:
            id:
              type: string
              pattern: "^att_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - pending
                - ready
                - failed
                - deleted
            targetId:
              $ref: "#/components/schemas/SovereignRecordId"
            filename:
              type: string
              minLength: 1
            contentType:
              type: string
              minLength: 1
            byteSize:
              type: integer
              minimum: 0
            uploadedByActorId:
              $ref: "#/components/schemas/ActorId"
    ApprovalRecord:
      allOf:
        - $ref: "#/components/schemas/RecordBase"
        - type: object
          required:
            - targetId
            - summary
            - requestedByActorId
          properties:
            id:
              type: string
              pattern: "^apv_[A-Za-z0-9_-]{1,88}$"
            status:
              type: string
              enum:
                - requested
                - approved
                - rejected
                - cancelled
            targetId:
              $ref: "#/components/schemas/SovereignRecordId"
            summary:
              type: string
              minLength: 1
            requestedByActorId:
              $ref: "#/components/schemas/ActorId"
            approverActorId:
              $ref: "#/components/schemas/ActorId"
    SovereignRecord:
      oneOf:
        - $ref: "#/components/schemas/DocRecord"
        - $ref: "#/components/schemas/ProjectRecord"
        - $ref: "#/components/schemas/IncidentRecord"
        - $ref: "#/components/schemas/CommentRecord"
        - $ref: "#/components/schemas/AttachmentRecord"
        - $ref: "#/components/schemas/ApprovalRecord"
    RecordListResponse:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/SovereignRecord"
    RecordResponse:
      type: object
      required:
        - record
      properties:
        record:
          $ref: "#/components/schemas/SovereignRecord"
    CreateRecordRequest:
      type: object
      required:
        - kind
        - record
      properties:
        kind:
          $ref: "#/components/schemas/RecordKind"
        record:
          $ref: "#/components/schemas/SovereignRecord"
    UpdateRecordRequest:
      type: object
      required:
        - changes
      properties:
        changes:
          type: object
          additionalProperties: true
    AgentActionPreviewRequest:
      type: object
      required:
        - actorId
        - capability
        - risk
        - summary
      properties:
        actorId:
          $ref: "#/components/schemas/ActorId"
        targetId:
          $ref: "#/components/schemas/SovereignRecordId"
        capability:
          $ref: "#/components/schemas/GatewayCapability"
        risk:
          $ref: "#/components/schemas/RiskLevel"
        summary:
          type: string
          minLength: 1
    AgentActionPreview:
      type: object
      required:
        - id
        - workspaceId
        - actorId
        - capability
        - risk
        - summary
      properties:
        id:
          type: string
          pattern: "^obj_[A-Za-z0-9_-]{1,88}$"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        actorId:
          $ref: "#/components/schemas/ActorId"
        capability:
          $ref: "#/components/schemas/GatewayCapability"
        risk:
          $ref: "#/components/schemas/RiskLevel"
        summary:
          type: string
          minLength: 1
    AgentActionPreviewResponse:
      type: object
      required:
        - preview
        - decision
      properties:
        preview:
          $ref: "#/components/schemas/AgentActionPreview"
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        reason:
          type: string
    AuditEntry:
      type: object
      required:
        - workspaceId
        - actorId
        - action
        - decision
        - redactedPaths
        - recordedAt
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        actorId:
          $ref: "#/components/schemas/ActorId"
        action:
          type: string
          minLength: 1
        decision:
          $ref: "#/components/schemas/PolicyDecision"
        redactedPaths:
          type: array
          items:
            type: string
        recordedAt:
          type: string
          format: date-time
    AuditEntryListResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
    AuditExportEntity:
      oneOf:
        - type: string
          minLength: 1
        - type: object
          additionalProperties: true
    AuditExportEvent:
      type: object
      required:
        - timestamp
        - type
      properties:
        eventId:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          minLength: 1
        decision:
          type:
            - string
            - "null"
          minLength: 1
        actor:
          oneOf:
            - $ref: "#/components/schemas/AuditExportEntity"
            - type: "null"
        target:
          oneOf:
            - $ref: "#/components/schemas/AuditExportEntity"
            - type: "null"
        reason:
          type:
            - string
            - "null"
          minLength: 1
        attributes:
          type: object
          additionalProperties: true
        context:
          type: object
          additionalProperties: true
    AuditExportStringOrList:
      oneOf:
        - type: string
          minLength: 1
        - type: array
          items:
            type: string
            minLength: 1
        - type: "null"
    AuditExportFilters:
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/AuditExportStringOrList"
        decisions:
          $ref: "#/components/schemas/AuditExportStringOrList"
        type:
          $ref: "#/components/schemas/AuditExportStringOrList"
        types:
          $ref: "#/components/schemas/AuditExportStringOrList"
        from:
          type:
            - string
            - "null"
          format: date-time
        fromTimestamp:
          type:
            - string
            - "null"
          format: date-time
        to:
          type:
            - string
            - "null"
          format: date-time
        toTimestamp:
          type:
            - string
            - "null"
          format: date-time
    AuditExportRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditExportEvent"
        filters:
          $ref: "#/components/schemas/AuditExportFilters"
        createdAt:
          type: string
          format: date-time
        exportId:
          type: string
          minLength: 1
    AuditExportNormalizedFilters:
      type: object
      required:
        - decisions
        - types
        - fromTimestamp
        - toTimestamp
      properties:
        decisions:
          type: array
          items:
            type: string
            minLength: 1
        types:
          type: array
          items:
            type: string
            minLength: 1
        fromTimestamp:
          type:
            - string
            - "null"
          format: date-time
        toTimestamp:
          type:
            - string
            - "null"
          format: date-time
    AuditExportContentDescriptor:
      type: object
      required:
        - fingerprint
        - mediaType
        - bytes
      properties:
        fingerprint:
          type: string
          minLength: 1
        mediaType:
          type: string
          minLength: 1
        bytes:
          type: integer
          minimum: 0
        rows:
          type: integer
          minimum: 0
        lines:
          type: integer
          minimum: 0
        columns:
          type: array
          items:
            type: string
            minLength: 1
    AuditExportManifest:
      type: object
      required:
        - kind
        - version
        - exportId
        - createdAt
        - eventCount
        - firstTimestamp
        - lastTimestamp
        - decisions
        - types
        - filters
        - eventFingerprints
        - jsonl
        - csv
        - fingerprint
      properties:
        kind:
          type: string
          const: audit-export.manifest
        version:
          type: integer
          minimum: 1
        exportId:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        eventCount:
          type: integer
          minimum: 0
        firstTimestamp:
          type:
            - string
            - "null"
          format: date-time
        lastTimestamp:
          type:
            - string
            - "null"
          format: date-time
        decisions:
          type: array
          items:
            type: string
            minLength: 1
        types:
          type: array
          items:
            type: string
            minLength: 1
        filters:
          $ref: "#/components/schemas/AuditExportNormalizedFilters"
        eventFingerprints:
          type: array
          items:
            type: string
            minLength: 1
        jsonl:
          $ref: "#/components/schemas/AuditExportContentDescriptor"
        csv:
          $ref: "#/components/schemas/AuditExportContentDescriptor"
        fingerprint:
          type: string
          minLength: 1
    AuditExportContentResponse:
      type: object
      required:
        - kind
        - format
        - mediaType
        - content
        - fingerprint
        - exportId
        - createdAt
        - manifest
      properties:
        kind:
          type: string
          const: audit-export.content
        format:
          type: string
          enum:
            - jsonl
            - csv
        mediaType:
          type: string
          minLength: 1
        content:
          type: string
        fingerprint:
          type: string
          minLength: 1
        exportId:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
        manifest:
          $ref: "#/components/schemas/AuditExportManifest"
    AuditExportPackage:
      type: object
      required:
        - kind
        - version
        - manifest
        - jsonl
        - csv
        - fingerprint
      properties:
        kind:
          type: string
          const: audit-export.package
        version:
          type: integer
          minimum: 1
        manifest:
          $ref: "#/components/schemas/AuditExportManifest"
        jsonl:
          type: string
        csv:
          type: string
        fingerprint:
          type: string
          minLength: 1
    DeviceId:
      type: string
      pattern: "^dev_[A-Za-z0-9_-]{1,88}$"
    SyncCursor:
      type: string
      pattern: "^cur_v1:[0-9]{16}:(origin|evt_[A-Za-z0-9_-]{1,88})$"
    SyncEventId:
      type: string
      pattern: "^evt_[A-Za-z0-9_-]{1,88}$"
    SyncEventEnvelope:
      type: object
      required:
        - id
        - workspaceId
        - deviceId
        - sequence
        - type
        - payload
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/SyncEventId"
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          minLength: 1
        payload: true
        createdAt:
          type: string
          format: date-time
    SyncedEventEnvelope:
      allOf:
        - $ref: "#/components/schemas/SyncEventEnvelope"
        - type: object
          required:
            - cursor
          properties:
            cursor:
              $ref: "#/components/schemas/SyncCursor"
    SyncUploadBatch:
      type: object
      required:
        - workspaceId
        - deviceId
        - baseCursor
        - events
        - checksum
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        baseCursor:
          $ref: "#/components/schemas/SyncCursor"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncEventEnvelope"
        checksum:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
    SyncUploadReceipt:
      type: object
      required:
        - workspaceId
        - deviceId
        - baseCursor
        - nextCursor
        - events
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        baseCursor:
          $ref: "#/components/schemas/SyncCursor"
        nextCursor:
          $ref: "#/components/schemas/SyncCursor"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncedEventEnvelope"
    SyncDownloadRequest:
      type: object
      required:
        - workspaceId
        - deviceId
        - afterCursor
        - limit
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        afterCursor:
          $ref: "#/components/schemas/SyncCursor"
        limit:
          type: integer
          minimum: 1
          maximum: 500
    SyncDownloadWindow:
      type: object
      required:
        - workspaceId
        - afterCursor
        - nextCursor
        - events
        - hasMore
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        afterCursor:
          $ref: "#/components/schemas/SyncCursor"
        nextCursor:
          $ref: "#/components/schemas/SyncCursor"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SyncedEventEnvelope"
        hasMore:
          type: boolean
    SyncCursorStatusRequest:
      type: object
      required:
        - workspaceId
        - deviceId
        - cursor
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        cursor:
          $ref: "#/components/schemas/SyncCursor"
    SyncCursorStatusResponse:
      type: object
      required:
        - workspaceId
        - deviceId
        - cursor
        - currentCursor
        - stale
      properties:
        workspaceId:
          $ref: "#/components/schemas/WorkspaceId"
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        cursor:
          $ref: "#/components/schemas/SyncCursor"
        currentCursor:
          $ref: "#/components/schemas/SyncCursor"
        stale:
          type: boolean
    McpResourceSummary:
      type: object
      required:
        - uri
        - name
      properties:
        uri:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        mimeType:
          type: string
    McpResourceListResponse:
      type: object
      required:
        - resources
      properties:
        resources:
          type: array
          items:
            $ref: "#/components/schemas/McpResourceSummary"
    McpReadResourceRequest:
      type: object
      required:
        - uri
      properties:
        uri:
          type: string
          minLength: 1
    McpResourceContent:
      type: object
      required:
        - uri
      properties:
        uri:
          type: string
          minLength: 1
        mimeType:
          type: string
        text:
          type: string
        blob:
          type: string
        trust:
          $ref: "#/components/schemas/McpSafetyTrustLevel"
        safety:
          $ref: "#/components/schemas/McpSafetyAnnotation"
    McpSafetyTrustLevel:
      type: string
      enum:
        - trusted
        - review
        - untrusted
    McpSafetyFinding:
      type: object
      required:
        - id
        - severity
        - path
        - reason
        - excerpt
      properties:
        id:
          type: string
          minLength: 1
        severity:
          type: string
          enum:
            - medium
            - high
        path:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
    McpSafetyAnnotation:
      type: object
      required:
        - schemaVersion
        - scope
        - trustLevel
        - action
        - reasons
        - findings
      properties:
        schemaVersion:
          type: integer
          const: 1
        scope:
          type: string
          enum:
            - mcp_tool_output
            - mcp_resource_content
        trustLevel:
          $ref: "#/components/schemas/McpSafetyTrustLevel"
        action:
          type: string
          enum:
            - mark_only
        reasons:
          type: array
          items:
            type: string
            minLength: 1
        findings:
          type: array
          items:
            $ref: "#/components/schemas/McpSafetyFinding"
    McpReadResourceResponse:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          items:
            $ref: "#/components/schemas/McpResourceContent"
    McpToolInputSchema:
      type: object
      required:
